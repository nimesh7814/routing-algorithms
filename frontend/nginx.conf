server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Serve static files directly
    location ~* \.(js|css|png|jpg|ico|svg|woff2?)$ {
        expires 1h;
        add_header Cache-Control "public";
    }

    # All other routes serve index.html (SPA fallback)
    location / {
        try_files $uri $uri/ /index.html;
    }
}
